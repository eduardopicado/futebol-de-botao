<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Futebol de Botão</title>
  <meta name="description" content="Brazilian table football: flick your buttons, three touches to score. No accounts, no tracking, works offline.">
  <meta name="theme-color" content="#0E3A32">
  <meta name="color-scheme" content="dark light">
  <!-- launched from the iPad home screen it should look like an app, not a page -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Botão">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <!-- what iOS shows while the app starts: the start screen, made for each
       screen by npm run make:launch (tools/launch.ts) -->
  <!-- launch images -->
  <!-- the board's green from the very first frame, not a white flash -->
  <style>html { background: #0E3A32; }</style>
</head>
<body>
  <main id="app" class="app"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
