name: CI

on:
  push:
    branches: [main]
  pull_request:

# A branch with a pull request open was running the whole suite twice, once
# for the push and once for the pull request, on two separate runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit
        run: npm run test:unit

      - name: Typecheck and build
        run: npm run build

  # The browser tests, one job per device, side by side.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    # a healthy job takes a few minutes; this only catches a genuine hang
    timeout-minutes: 20
    strategy:
      # one device failing should not hide what the others found
      fail-fast: false
      matrix:
        include:
          - { project: ipad-portrait, browser: chromium }
          - { project: ipad-landscape, browser: chromium }
          - { project: phone, browser: chromium }
          # Safari's engine, at the iPad's size
          - { project: ipad-webkit, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # each job serves its own build; it takes seconds
      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End to end
        run: npx playwright test --project ${{ matrix.project }}

      # traces of what failed, to open with `npx playwright show-trace`
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
